<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Track | Login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <video class="sky-video" autoplay muted loop playsinline>
        <source src="sky-clouds.mp4" type="video/mp4">
    </video>
    <div class="sky-overlay"></div>
    <div class="plane-container">
        <span class="plane">✈</span>
    </div>
    <main class="login-wrapper">
        <div class="login-card">
            <div class="logo-circle">✈</div>
            <h2>Welcome back</h2>
            <p class="subtitle">
                Please enter your details to sign in.
            </p>
            <form id="loginForm">
                <label for="email">E-Mail Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email..."
                    required
                >
                <label for="password">Password</label>
                <div class="password-box">
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                    <button
                        type="button"
                        id="togglePassword"
                        aria-label="Show password">
                        ◉
                    </button>
                </div>
  
                <div class="form-options">

                    <label class="remember">
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#" id="forgotLink">
                        Forgot password?
                    </a>

                </div>

                <!-- SIGN IN -->
                <button type="submit" class="signin-btn">
                    Sign in
                </button>

            </form>
            <p class="footer-text">
                SKY TRACK · BAGGAGE MANAGEMENT SYSTEM
            </p>

        </div>

    </main>


    <div class="takeoff-overlay" id="takeoffOverlay">

        <div class="takeoff-plane">✈</div>

        <p>PREPARING YOUR DEPARTURE...</p>

    </div>

    <script src="login.js"></script>

</body>
</html>
